<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikTok Shop Callback</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        background: #f6f7f9;
        color: #1f2937;
      }

      main {
        max-width: 760px;
        margin: 64px auto;
        padding: 32px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }

      label {
        display: block;
        margin: 24px 0 8px;
        font-weight: 700;
      }

      code,
      textarea {
        box-sizing: border-box;
        width: 100%;
        font-family: Consolas, Monaco, monospace;
        font-size: 14px;
      }

      textarea {
        min-height: 92px;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        resize: vertical;
      }

      button {
        margin-top: 12px;
        padding: 10px 14px;
        border: 0;
        border-radius: 6px;
        background: #111827;
        color: #fff;
        cursor: pointer;
      }

      .hint {
        color: #6b7280;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TikTok Shop 授权回调</h1>
      <p class="hint">
        如果授权成功，下面会显示 TikTok Shop 返回的 code。复制 code 后，在本地脚本中换取 access_token。
      </p>

      <label for="code">code</label>
      <textarea id="code" readonly></textarea>
      <button id="copy-code" type="button">复制 code</button>

      <label for="full-url">完整回调 URL</label>
      <textarea id="full-url" readonly></textarea>
      <button id="copy-url" type="button">复制完整 URL</button>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code") || "";
      const codeEl = document.getElementById("code");
      const urlEl = document.getElementById("full-url");

      codeEl.value = code || "没有检测到 code。请确认 TikTok Shop 授权后跳回了这个页面。";
      urlEl.value = window.location.href;

      async function copyFrom(element) {
        await navigator.clipboard.writeText(element.value);
      }

      document.getElementById("copy-code").addEventListener("click", () => copyFrom(codeEl));
      document.getElementById("copy-url").addEventListener("click", () => copyFrom(urlEl));
    </script>
  </body>
</html>
